name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12' }
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: NiceVisuals
          path: build/libs/*.jar
      - name: Publish jar to branch
        run: |
          mkdir /tmp/out && cp build/libs/nicevisuals-*.jar /tmp/out/ && rm -f /tmp/out/*-sources.jar
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan jar && git rm -rf -q --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/*.jar . && git add -A && git commit -q -m "built jar" && git push -f origin jar
