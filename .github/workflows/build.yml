name: Build FazeVisuals
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FazeVisuals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: FazeVisuals
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FazeVisuals-jar
          path: FazeVisuals/build/libs/FazeVisuals-*.jar
